<div class="card m-3">
  <h5 class="card-header">Login Form</h5>
  <div class="card-body">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Login</label>
        <input
          type="text"
          formControlName="login"
          class="form-control"
          [ngClass]="{ 'is-invalid': submitted && form['login'].errors }"
        />
        @if (submitted && form['login'].errors?.['required']) {
          <div class="invalid-feedback">Login is required</div>
        }
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          formControlName="password"
          class="form-control"
          [ngClass]="{ 'is-invalid': submitted && form['password'].errors }"
        />
        @if (submitted && form['password'].errors?.['required']) {
          <div class="invalid-feedback">Password is required</div>
        }
      </div>

      @if (errorMessage) {
        <div class="alert alert-danger">{{ errorMessage }}</div>
      }

      @if (token) {
        <div class="alert alert-success">
          Connexion réussie ! Token reçu :
          <code class="d-block text-break">{{ token }}</code>
        </div>
      }

      <div class="text-center">
        <button class="btn btn-primary" [disabled]="isLoading">
          {{ isLoading ? 'Connexion...' : 'Login' }}
        </button>
      </div>
    </form>
  </div>
</div>
